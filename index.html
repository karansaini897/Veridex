    <script>
      (function () {
        try {
          var savedTheme = window.localStorage.getItem('veridex_portal_theme_v7');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
